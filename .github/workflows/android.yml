name: Android APK

# Construit l'APK (Capacitor) sur les serveurs de GitHub : aucun SDK Android n'est nécessaire en local.
# - Sur un tag v* : l'APK de debug est joint à la release correspondante.
# - En lancement manuel : l'APK est disponible comme artefact du run (et joint à la release si un tag est indiqué).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de release auquel joindre l’APK (laisser vide : artefact seulement)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - run: npx cap sync android
      - name: Construire l'APK de debug
        working-directory: android
        run: |
          VERSION=$(node -p "require('../package.json').version")
          chmod +x gradlew
          ./gradlew assembleDebug -PappVersionName="$VERSION" -PappVersionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "../rcivic-plus-$VERSION-debug.apk"
          echo "APK=rcivic-plus-$VERSION-debug.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: rcivic-plus-apk
          path: rcivic-plus-*-debug.apk
          if-no-files-found: error
      - name: Joindre l'APK à la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" "$APK" --clobber
